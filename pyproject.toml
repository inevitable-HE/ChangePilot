[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "changepilot"
version = "0.1.0"
description = "Bounded change-planning agent with a reliable workflow runtime."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "langgraph>=1.0,<2",
    "openai>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "hypothesis>=6.120,<7",
]
retrieval = [
    "sentence-transformers>=5.0,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live_llm: opt-in test that spends a bounded real model API call",
]
